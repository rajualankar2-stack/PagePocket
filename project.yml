name: PagePocket
options:
  bundleIdPrefix: com.pagepocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Signing is left ENABLED and automatic so the project can be deployed to a
    # real iPhone straight from Xcode: pick a team under Signing & Capabilities
    # and it works. CI passes CODE_SIGNING_ALLOWED=NO on the command line, which
    # overrides this without affecting the checked-in project.
    CODE_SIGN_STYLE: Automatic
    # Set to the user's team so Xcode and xcodebuild agree. Their Apple ID
    # (rajualankar2@gmail.com) is signed into Xcode, so automatic signing can
    # mint a fresh certificate. CI overrides signing on the command line.
    DEVELOPMENT_TEAM: "7ABAG66RBQ"

targets:
  PagePocket:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PagePocket/Sources
      - path: Shared
      - path: PagePocket/Resources
        excludes:
          - "Info.plist"
          - "PagePocket.entitlements"
          - "Samples"
      # A folder reference, so each sample keeps its own directory instead of
      # every file being flattened into the bundle root (which would collide on
      # the shared index.html / style.css names).
      - path: PagePocket/Resources/Samples
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagepocket.app
        PRODUCT_NAME: PagePocket
        INFOPLIST_FILE: PagePocket/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PagePocket/Resources/PagePocket.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      # Embeds the extension into PagePocket.app/PlugIns so iOS can discover it.
      - target: PagePocketShare
        embed: true
        codeSign: true

  # Share Extension: receives HTML from the Files app and other apps, stages it
  # in the shared App Group container for the app to import.
  PagePocketShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PagePocketShare
        excludes:
          - "Info.plist"
          - "PagePocketShare.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagepocket.app.share
        PRODUCT_NAME: PagePocketShare
        INFOPLIST_FILE: PagePocketShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: PagePocketShare/PagePocketShare.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PagePocketUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PagePocketUITests
    dependencies:
      - target: PagePocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagepocket.app.uitests
        TEST_TARGET_NAME: PagePocket
        GENERATE_INFOPLIST_FILE: YES

  PagePocketTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PagePocketTests
        excludes:
          - "Fixtures"
      # Folder reference so the .zip fixtures keep their names and are not
      # treated as build sources.
      - path: PagePocketTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PagePocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagepocket.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PagePocket.app/PagePocket"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PagePocket:
    build:
      targets:
        PagePocket: all
        PagePocketUITests: [test]
        PagePocketTests: [test]
    run:
      config: Debug
      # Opens a bundled document automatically, so the app does not sit on the
      # library screen when run from Xcode.
      commandLineArguments:
        "-AutoOpenDocument": "Welcome"
    test:
      config: Debug
      targets:
        - PagePocketTests
        - PagePocketUITests
