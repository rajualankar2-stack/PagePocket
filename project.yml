name: PagePocket
options:
  bundleIdPrefix: com.pagepocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  PagePocket:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PagePocket/Sources
      - path: PagePocket/Resources
        excludes:
          - "Info.plist"
          - "Samples"
      # A folder reference, so each sample keeps its own directory instead of
      # every file being flattened into the bundle root (which would collide on
      # the shared index.html / style.css names).
      - path: PagePocket/Resources/Samples
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagepocket.app
        PRODUCT_NAME: PagePocket
        INFOPLIST_FILE: PagePocket/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
