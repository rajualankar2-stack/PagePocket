name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & run on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PagePocket.xcodeproj \
            -scheme PagePocket \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -80

      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find build/Build/Products -name "PagePocket.app" -maxdepth 3 -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::PagePocket.app was not produced"
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Boot simulator
        id: sim
        run: |
          # Resolve a concrete device at runtime instead of hard-coding a name:
          # available iPhone models differ between runner images.
          RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['runtimes']; ios=[r for r in d if r['isAvailable'] and r['name'].startswith('iOS')]; ios.sort(key=lambda r: [int(p) for p in r['version'].split('.')], reverse=True); print(ios[0]['identifier'])")
          echo "Using runtime: $RUNTIME"

          PREFERRED=$(xcrun simctl list devicetypes --json \
            | python3 -c "import json,sys; t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPhone')]; p=[x for x in t if 'iPhone 17 Pro' in x] or [x for x in t if 'iPhone 17' in x] or t; print(p[0])")
          echo "Using device type: $PREFERRED"

          UDID=$(xcrun simctl create "PagePocket-Test" "$PREFERRED" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # -b boots the device if needed and blocks until it is fully booted.
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="${{ steps.app.outputs.path }}"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.pagepocket.app
          # Give the app a moment to import its sample documents and render.
          sleep 12

      - name: Capture screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" screenshot launch-library.png
          echo "Captured library screenshot"
          ls -la launch-library.png

      - name: Open a bundled document and screenshot the rendered page
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl terminate "$UDID" com.pagepocket.app || true
          # The Debug-only AutoOpenDocument hook drives straight to a rendered
          # page, which cannot otherwise be scripted through the file picker.
          xcrun simctl launch "$UDID" com.pagepocket.app -AutoOpenDocument Welcome
          sleep 14
          xcrun simctl io "$UDID" screenshot rendered-welcome.png
          ls -la rendered-welcome.png

      - name: Verify the local server started and served the page
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "$UDID" log show \
            --last 3m \
            --predicate 'subsystem == "com.pagepocket.app"' \
            --style compact 2>/dev/null > applog.txt || true

          echo "--- local server line ---"
          grep -i "local server" applog.txt || echo "(not found)"
          echo "--- AutoOpenDocument line ---"
          grep -i "AutoOpenDocument" applog.txt || echo "(not found)"

          if ! grep -qi "Local server listening" applog.txt; then
            echo "::error::The loopback HTTP server never reported a listening port."
            exit 1
          fi
          if ! grep -qi "AutoOpenDocument: opening" applog.txt; then
            echo "::error::The document failed to open automatically."
            exit 1
          fi
          echo "Local server bound a port and the document opened."

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcodebuild test \
            -project PagePocket.xcodeproj \
            -scheme PagePocket \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee test.log | tail -60

      - name: Summarise test results
        if: always()
        run: |
          if [ -d test-results.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path test-results.xcresult > test-summary.json 2>/dev/null \
              && cat test-summary.json || echo "(summary unavailable)"
          fi

      - name: Collect simulator logs
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "PagePocket"' > simulator.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagepocket-build
          path: |
            launch-library.png
            rendered-welcome.png
            applog.txt
            build.log
            test.log
            test-summary.json
            simulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if the build log contains errors
        run: |
          if grep -qE "error: " build.log; then
            echo "::error::Compiler errors found in build log"
            grep -E "error: " build.log | head -40
            exit 1
          fi
          echo "No compiler errors."
